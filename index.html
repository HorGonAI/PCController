<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PCController Web</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>PCController</h1>
        <p>Веб-панель для управления ботом и ПК через Telegram Web App.</p>
      </header>

      <section class="panel">
        <h2>Быстрые действия</h2>
        <div class="panel__buttons">
          <button class="btn" id="screenshot-btn">Сделать скриншот</button>
        </div>
        <p class="panel__hint" id="status">Ожидание команды…</p>
      </section>

      <section class="panel">
        <h2>Настройки качества</h2>
        <div class="settings">
          <div class="setting">
            <div class="setting__header">
              <span>Сжатие</span>
              <label class="toggle">
                <input type="checkbox" id="compression-toggle" />
                <span class="toggle__track"></span>
              </label>
            </div>
            <p class="setting__hint">Включите, чтобы отправлять JPEG со сжатием.</p>
          </div>

          <div class="setting">
            <label class="setting__label" for="resolution-select">Разрешение</label>
            <select id="resolution-select" class="select">
              <option value="1280x720">1280×720</option>
              <option value="1920x1080">1920×1080</option>
              <option value="2560x1440">2560×1440</option>
            </select>
          </div>

          <div class="setting">
            <label class="setting__label" for="quality-range">Качество: <span id="quality-value">85</span></label>
            <input type="range" id="quality-range" min="10" max="100" value="85" />
          </div>
        </div>
      </section>

      <section class="panel panel--warning" id="webapp-warning" hidden>
        <h2>Внимание</h2>
        <p>Откройте страницу через кнопку <strong>Open</strong> в Telegram для управления.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
