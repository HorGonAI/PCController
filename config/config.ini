# Comma-separated list of allowed Telegram chat IDs.
# Leave empty to allow all chats
allowed_chat_ids=

# Screenshot settings
screenshot.width=1280
screenshot.height=720
screenshot.compression=true
screenshot.quality=85
screenshot.format=jpg

# Telegram Web App URL (shows an Open button in attachment menu)
webapp.url=https://horgonai.github.io/PCController/

# Debug logging (leave empty to disable)
debug.log_path=
